        <SectionCard title="تحليل البراز 💩">
          {stoolData.alarming.length>0&&(
            <Alert severity="error" sx={{mb:1.5,borderRadius:2.5}}>⚠️ براز بلون غير طبيعي ({stoolData.alarming.join("، ")}) — يُنصح بمراجعة الطبيب.</Alert>
          )}
          <Typography variant="caption" fontWeight={700} color="text.secondary" sx={{display:"block",mb:1}}>آخر سجلات البراز</Typography>
          <Stack spacing={0.75} sx={{mb:1.5}}>
            {stoolData.sorted5.map((x,i)=>{
              const k=x.stoolColor?Object.keys(stoolData.COLORS).find(k=>x.stoolColor.includes(k)):null;
              const info=k?stoolData.COLORS[k]:null;
              const s=info?STATUS[info.st]:STATUS.info;
              const fillKey=x.stoolColor?Object.keys(STOOL_FILL).find(k=>x.stoolColor.includes(k)):null;
              return(
                <Stack key={i} direction="row" alignItems="center" spacing={1}>
                  <Typography variant="caption" sx={{color:"#94a3b8",fontWeight:700,minWidth:40,textAlign:"left",flexShrink:0}}>{fmtTime(x.date,x.time)}</Typography>
                  {fillKey&&<Box sx={{width:14,height:14,borderRadius:"50%",bgcolor:STOOL_FILL[fillKey],border:"1px solid #00000022",flexShrink:0}}/>}
                  <Typography variant="caption" fontWeight={700} sx={{color:s.text,flex:1,textAlign:"right"}}>
                    {x.stoolColor||"بدون لون"}{x.stoolTexture?` · ${x.stoolTexture}`:""}
                  </Typography>
                  {info&&<Typography variant="caption" sx={{color:s.text,opacity:0.7,fontSize:10,flexShrink:0,maxWidth:110,textAlign:"right"}}>{info.note}</Typography>}
                </Stack>
              );
            })}
          </Stack>
          {Object.keys(stoolData.colorCount).length>0&&(
            <>
              <Typography variant="caption" fontWeight={700} color="text.secondary" sx={{display:"block",mb:0.75}}>توزيع الألوان</Typography>
              <Stack direction="row" spacing={1} useFlexGap flexWrap="wrap" sx={{mb:1.25}}>
                {Object.entries(stoolData.colorCount).map(([color,count])=>{
                  const k=Object.keys(stoolData.COLORS).find(k=>color.includes(k));
                  const s=k?STATUS[stoolData.COLORS[k].st]:STATUS.info;
                  return <Chip key={color} label={`${color} (${count})`} size="small" sx={{bgcolor:s.bg,color:s.text,border:`1px solid ${s.border}`,fontWeight:700}}/>;
                })}
              </Stack>
            </>
          )}
          <Box sx={{p:1.25,borderRadius:2,bgcolor:"#f8fafc",border:"1px solid #e2e8f0"}}>
            <Typography variant="caption" fontWeight={800} color="text.secondary" sx={{display:"block",mb:0.75}}>مرجع طبي سريع</Typography>
            <Stack spacing={0.5}>
              {Object.entries(stoolData.COLORS).map(([color,info])=>{const s=STATUS[info.st];return(
                <Stack key={color} direction="row" alignItems="flex-start" spacing={1}>
                  <Chip size="small" label={color} sx={{bgcolor:s.bg,color:s.text,border:`1px solid ${s.border}`,fontWeight:700,minWidth:50,fontSize:10,height:18,flexShrink:0}}/>
                  <Typography variant="caption" sx={{color:"#64748b",flex:1,fontSize:10,lineHeight:1.5,textAlign:"right"}}>{info.note}</Typography>
                </Stack>
              );})}
            </Stack>
          </Box>
        </SectionCard>
      )}

      {/* ── 8. Growth and ready insights ── */}
      <SectionCard title="النمو والوزن — قراءة جاهزة ⚖️">
        <Alert severity="info" sx={{ mb: 1.5, borderRadius: 2.5, fontSize: 13 }}>
          للطفل المبتسر، قراءة الوزن وحدها لا تكفي كمنحنى نمو نهائي. الأفضل أن يراجع الطبيب الوزن مع الطول ومحيط الرأس على منحنى مناسب للمبتسرين.
        </Alert>

        <Box sx={{display:"grid",gridTemplateColumns:{xs:"repeat(2,1fr)",md:"repeat(4,1fr)"},gap:1.25,mb:1.5}}>
          {[
            {label:"العمر الزمني", value:growth.ageText, icon:"📅", color:"#2563eb", soft:"#eff6ff"},
            {label:"العمر الحملي الحالي", value:growth.pmaText, icon:"⏳", color:"#7c3aed", soft:"#f5f3ff"},
            {label:"العمر التصحيحي", value:growth.correctedText, icon:"🧭", color:"#0891b2", soft:"#ecfeff"},
            {label:"الوزن الحالي", value:growth.latestG ? `${growth.latestG} g` : "—", icon:"⚖️", color:"#d97706", soft:"#fffbeb"},
            {label:"فرق وزن الولادة", value:growth.gainFromBirth===null ? "—" : `${growth.gainFromBirth>=0?"+":""}${growth.gainFromBirth} g`, icon:"👶", color:growth.gainFromBirth>=0?"#10b981":"#ef4444", soft:growth.gainFromBirth>=0?"#ecfdf5":"#fef2f2"},
            {label:"معدل الزيادة", value:growth.gainPerDay===null ? "—" : `${round1(growth.gainPerDay)} g/day`, icon:"📈", color:"#2563eb", soft:"#eff6ff"},
            {label:"زيادة لكل كجم", value:growth.gainPerKgDay===null ? "—" : `${round1(growth.gainPerKgDay)} g/kg/day`, icon:"📊", color:"#7c3aed", soft:"#f5f3ff"},
            {label:"عدد قياسات الوزن", value:growth.weightsAsc.length, icon:"🧾", color:"#64748b", soft:"#f8fafc"},
          ].map((c,i)=>(
            <Paper key={i} elevation={0} sx={{p:1.5,borderRadius:2.5,border:"1px solid #e7ecf5",background:`linear-gradient(135deg,#fff 0%,${c.soft} 100%)`}}>
              <Typography variant="caption" sx={{color:"#64748b",fontWeight:800,display:"block",textAlign:"right",mb:.5}}>{c.icon} {c.label}</Typography>
              <Typography sx={{fontWeight:900,fontSize:{xs:17,md:18},color:"#0f172a",textAlign:"right",lineHeight:1.25}}>{c.value}</Typography>
            </Paper>
          ))}
        </Box>

        <Box sx={{display:"grid",gridTemplateColumns:{xs:"1fr",md:"repeat(3,1fr)"},gap:1.25}}>
          <StatusBox
            status={growth.birthRecovered===null?"info":growth.birthRecovered?"ok":"warn"}
            title="استعادة وزن الولادة"
            value={growth.birthRecovered===null ? "غير متاح" : growth.birthRecovered ? "نعم، الوزن الحالي أعلى أو مساوي لوزن الولادة" : "لا، لم يصل بعد لوزن الولادة"}
            note={growth.birthWeight ? `وزن الولادة المسجل: ${growth.birthWeight} g` : "ضع وزن الولادة في الإعدادات."}
          />
          <StatusBox
            status={growth.trendStatus.st}
            title="آخر تغير في الوزن"
            value={growth.trendStatus.label}
            note={growth.prevWeight ? `القياس السابق: ${safeNumber(growth.prevWeight.grams)} g` : "سجل قياسين على الأقل لقراءة الاتجاه."}
          />
          <StatusBox
            status={growth.velocityStatus.st}
            title="سرعة زيادة الوزن"
            value={growth.velocityStatus.label}
            note={growth.velocityStatus.note}
          />
        </Box>
      </SectionCard>

      <SectionCard title="مؤشرات جاهزة للقراءة 👀">
        <Box sx={{display:"grid",gridTemplateColumns:{xs:"1fr",md:"repeat(2,1fr)"},gap:1.25}}>
          <StatusBox
            status={ready.coverage >= 70 ? "ok" : ready.coverage >= 40 ? "warn" : "info"}
            title="دقة حساب كمية اللبن"
            value={`${ready.coverage}% من الرضعات لها كمية ml معروفة`}
            note={`الرضعات المباشرة من الثدي لا تدخل في إجمالي ml إلا لو تم تقديرها بوزن قبل/بعد الرضعة.`}
          />
          <StatusBox
            status={ready.lastWetMin===null ? "info" : ready.lastWetMin <= 240 ? "ok" : ready.lastWetMin <= 360 ? "warn" : "bad"}
            title="آخر بول"
            value={ready.lastWetMin===null ? "لا يوجد سجل بول" : humanSince(ready.lastWetMin)}
            note="مفيد لمتابعة الترطيب، خصوصًا مع الرضاعة والوزن."
          />
          <StatusBox
            status={ready.h24.maxInterval && ready.h24.maxInterval > 240 ? "warn" : "ok"}
            title="أطول فاصل رضعات آخر 24 ساعة"
            value={ready.h24.maxInterval ? fmtMin(ready.h24.maxInterval) : "غير متاح"}
            note={ready.h24.maxInterval && ready.h24.maxInterval > 240 ? "الفاصل طويل؛ راجع خطة الرضاعة مع الطبيب." : "الفواصل تبدو مقبولة حسب السجلات."}
          />
          <StatusBox
            status={ready.todayKnownVsAvg===null ? "info" : ready.todayKnownVsAvg >= 0 ? "ok" : "warn"}
            title="اليوم مقارنة بمتوسطك السابق"
            value={ready.todayKnownVsAvg===null ? "غير متاح" : `${ready.todayKnownVsAvg>=0?"+":""}${round1(ready.todayKnownVsAvg)} ml عن المتوسط`}
            note="المقارنة مع متوسط بداية التسجيل حتى أمس، واليوم قد لا يكون مكتملًا."
          />
        </Box>
      </SectionCard>

      {/* ── 9. Target progress ── */}
      {targetMlDay>0&&(
        <SectionCard title="التقدم نحو هدف الطبيب 🎯">
          <Stack direction="row" justifyContent="space-between" sx={{mb:0.75}}>
            <Typography variant="caption" color="text.secondary" fontWeight={700}>متوسط اللبن الفعلي: {avgActual} ml/يوم</Typography>
            <Typography variant="caption" fontWeight={900} sx={{color:targetPct>=90?"#16a34a":targetPct>=70?"#d97706":"#dc2626"}}>{targetPct}% من {targetMlDay} ml</Typography>
          </Stack>
          <Box sx={{height:12,borderRadius:99,bgcolor:"#e2e8f0",overflow:"hidden"}}>
            <Box sx={{height:"100%",width:`${targetPct}%`,borderRadius:99,transition:"width 0.6s",
              background:targetPct>=90?"linear-gradient(90deg,#22c55e,#16a34a)":targetPct>=70?"linear-gradient(90deg,#fbbf24,#d97706)":"linear-gradient(90deg,#f87171,#dc2626)"}}/>
          </Box>
          <Typography variant="caption" color="text.secondary" sx={{display:"block",mt:0.75,textAlign:"right",lineHeight:1.6}}>
            {targetPct<70?"⚠️ الكمية المعروفة أقل من المستهدف — راجع الطبيب":targetPct<90?"🟡 الكمية المعروفة قريبة من الهدف":"✅ الكمية المعروفة حققت الهدف"}
            <br />
            لا يشمل الرضاعة الطبيعية المباشرة إلا إذا تم تقديرها وكتابتها ككمية ml.
          </Typography>
        </SectionCard>
      )}

      {/* ── 10. Summary stats ── */}
      <SectionCard title="ملخص الفترة">
        <Box sx={{display:"grid",gridTemplateColumns:{xs:"repeat(2,1fr)",md:"repeat(4,1fr)"},gap:1.5}}>
          <StatCard label="إجمالي الرضعات"      value={stats.feeds.length}  icon="🍼" color="#2563eb" soft="#eff6ff"/>
          <StatCard label="إجمالي اللبن المعروف" value={`${stats.knownMl} ml`} icon="🥛" color="#7c3aed" soft="#f5f3ff"/>
          <StatCard label="رضاعة طبيعية مباشرة" value={stats.direct.length} sub={`${stats.directMinutes} دقيقة`} icon="🤱" color="#db2777" soft="#fdf2f8"/>
          <StatCard label="رضعات بكمية معروفة"  value={stats.bottle.length} sub={`${stats.knownMl} ml`} icon="🧴" color="#0891b2" soft="#ecfeff"/>
          <StatCard label="حفاضات بول"           value={stats.wet}  sub={`متوسط ${round1(stats.avgWet)}/يوم`}   icon="💧" color="#10b981" soft="#ecfdf5"/>
          <StatCard label="حفاضات براز"          value={stats.stool} sub={`متوسط ${round1(stats.avgStool)}/يوم`} icon="🟤" color="#f97316" soft="#fff7ed"/>
          <StatCard label="فرق الوزن"            value={stats.gain===null?"—":`${stats.gain>0?"+":""}${stats.gain} g`} icon="⚖️" color="#d97706" soft="#fffbeb"/>
          <StatCard label="متوسط الزيادة"        value={stats.gainPerDay===null?"—":`${round1(stats.gainPerDay)} g`} sub="/يوم" icon="📈" color="#2563eb" soft="#eff6ff"/>
        </Box>
      </SectionCard>

      {/* ── 11. Charts ── */}
      <SectionCard title="الرسوم البيانية">
        <Box sx={{display:"grid",gridTemplateColumns:{xs:"1fr",md:"repeat(2,1fr)"},gap:2.5}}>
          <Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#d97706"}}>⚖️ تطور الوزن</Typography>
            <ChartCanvas type="line" labels={series.map(x=>x.date)} datasets={[{label:"الوزن g",data:series.map(x=>x.weight),tension:0.4,spanGaps:true,borderColor:"#d97706",backgroundColor:"#d9770618",fill:true,pointBackgroundColor:"#d97706"}]}/></Box>
          <Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#7c3aed"}}>🥛 كمية اللبن يوميًا</Typography>
            <ChartCanvas type="bar" labels={series.map(x=>x.date)} datasets={[{label:"ml",data:series.map(x=>x.knownMl),backgroundColor:"#7c3aed88",borderRadius:6,borderSkipped:false}]}/></Box>
          <Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#2563eb"}}>🍼 عدد الرضعات يوميًا</Typography>
            <ChartCanvas type="bar" labels={series.map(x=>x.date)} datasets={[{label:"رضعات",data:series.map(x=>x.feeds),backgroundColor:"#2563eb88",borderRadius:6,borderSkipped:false}]}/></Box>
          <Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#10b981"}}>🧷 الحفاضات يوميًا</Typography>
            <ChartCanvas type="bar" labels={series.map(x=>x.date)} datasets={[{label:"بول",data:series.map(x=>x.wet),backgroundColor:"#10b98188",borderRadius:6,borderSkipped:false},{label:"براز",data:series.map(x=>x.stool),backgroundColor:"#f9731688",borderRadius:6,borderSkipped:false}]}/></Box>
          {stats.directMinutes>0&&<Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#db2777"}}>🤱 مدة الرضاعة الطبيعية</Typography>
            <ChartCanvas type="line" labels={series.map(x=>x.date)} datasets={[{label:"دقائق",data:series.map(x=>x.directMinutes),tension:0.4,borderColor:"#db2777",backgroundColor:"#db277718",fill:true}]}/></Box>}
          {(()=>{
            const fp=FEED_TYPES.map(t=>({name:t,value:stats.feeds.filter(x=>x.type===t).length})).filter(x=>x.value>0);
            const td=[{name:"ليل 12-6",value:stats.nightFeeds},{name:"صباح 6-12",value:stats.morningFeeds},{name:"ظهر 12-6",value:stats.afternoonFeeds},{name:"مساء 6-12",value:stats.eveningFeeds}].filter(x=>x.value>0);
            return(<>
              {fp.length>0&&<Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#0891b2"}}>🍼 توزيع أنواع الرضعات</Typography>
                <ChartCanvas type="pie" labels={fp.map(x=>x.name)} datasets={[{label:"الأنواع",data:fp.map(x=>x.value)}]}/></Box>}
              {td.length>0&&<Box><Typography variant="body2" fontWeight={800} sx={{mb:1,textAlign:"right",color:"#7c3aed"}}>🕐 توزيع الرضعات حسب الوقت</Typography>
                <ChartCanvas type="pie" labels={td.map(x=>x.name)} datasets={[{label:"الوقت",data:td.map(x=>x.value)}]}/></Box>}
            </>);
          })()}
        </Box>
      </SectionCard>

      {/* ── 12. Doctor report ── */}
      <SectionCard title="تقرير للطبيب 🏥"
        action={<Stack direction="row" spacing={1}>
          <Button size="small" variant={copyDone?"contained":"outlined"} color={copyDone?"success":"primary"} onClick={copyReport} sx={{borderRadius:3}}>{copyDone?"✅ تم النسخ":"نسخ"}</Button>
          <Button size="small" variant="outlined" onClick={downloadReport} sx={{borderRadius:3}}>تحميل</Button>
        </Stack>}
      >
        <Alert severity="info" sx={{mb:1.5,borderRadius:3,fontSize:13}}>التقرير يوضح الكميات المعروفة فقط — لا يحسب الرضاعة الطبيعية المباشرة.</Alert>
        <Paper variant="outlined" sx={{p:2,borderRadius:3,bgcolor:"#fbfcff",direction:"rtl",textAlign:"right"}}>
          {doctorSummary.split("\n").map((line,i)=>(
            <Typography key={i} sx={{mb:i===0?1:0.5,fontWeight:i===0?900:500,lineHeight:1.9,fontSize:i===0?15:13}}>{line}</Typography>
          ))}
        </Paper>
      </SectionCard>
    </>
  );
}

function ChartCard({ title, children }) {
  return <SectionCard title={title}>{children}</SectionCard>;
}

function Reminders({ data, add, remove, setSyncPaused }) {
  const PRESETS = [
    { label: "كل ساعة", minutes: 60 },
    { label: "ساعتين", minutes: 120 },
    { label: "3 ساعات", minutes: 180 },
    { label: "4 ساعات", minutes: 240 },
  ];
  const [form, setForm] = React.useState({ title: "راجع الحفاضة", everyMinutes: 180, enabled: true, startTime: "08:00", endTime: "23:59" });
  const [notifStatus, setNotifStatus] = React.useState(null); // null | "granted" | "denied"
  const [errors, setErrors] = React.useState({});
  React.useEffect(() => { setSyncPaused(true); return () => setSyncPaused(false); }, []);

  async function requestNotifications() {
    if (!("Notification" in window)) { setNotifStatus("denied"); return; }
    const p = await Notification.requestPermission();
    setNotifStatus(p);
  }

  function formatMinutes(m) {
    if (m < 60) return `${m} دقيقة`;
    if (m % 60 === 0) return `${m / 60} ${m / 60 === 1 ? "ساعة" : "ساعات"}`;
    return `${Math.floor(m / 60)}س ${m % 60}د`;
  }

  async function submit() {
    const e = {};
    if (!form.title.trim()) e.title = "اكتب عنوان التنبيه";
    const mins = safeNumber(form.everyMinutes);
    if (!mins || mins < 1) e.everyMinutes = "الفاصل يجب أن يكون أكبر من صفر";
    if (Object.keys(e).length) { setErrors(e); return; }
    setErrors({});
    await add({ ...form, id: uid(), everyMinutes: mins, enabled: !!form.enabled, createdAt: new Date().toISOString() });
  }

  const sortedReminders = [...(data.reminders || [])].sort((a, b) => a.everyMinutes - b.everyMinutes);

  return (
    <>
      <Alert severity="info" icon={false} sx={{ mb: 2, borderRadius: 3, fontSize: 13, bgcolor: "#fffbeb", border: "1px solid #fcd34d", color: "#92400e" }}>
        ⚠️ إشعارات المتصفح تعمل فقط عند فتح التطبيق. التنبيهات الداخلية تعمل دائمًا.
      </Alert>

      <SectionCard title="إضافة تنبيه جديد">
        <Stack spacing={2}>
          {/* Title */}
          <TextField fullWidth label="عنوان التنبيه" value={form.title}
            onChange={e => setForm({ ...form, title: e.target.value })}
            error={!!errors.title} helperText={errors.title}
            sx={{ "& .MuiOutlinedInput-root": { borderRadius: 2.5 } }} />

          {/* Preset chips */}
          <Box>
            <Typography variant="caption" color="text.secondary" fontWeight={700} sx={{ display: "block", mb: 1 }}>الفاصل الزمني</Typography>
            <Stack direction="row" spacing={1} useFlexGap flexWrap="wrap" sx={{ mb: 1.5 }}>
              {PRESETS.map(p => (
                <Chip key={p.minutes} label={p.label} clickable
                  variant={form.everyMinutes === p.minutes ? "filled" : "outlined"}
                  color={form.everyMinutes === p.minutes ? "primary" : "default"}
                  onClick={() => setForm({ ...form, everyMinutes: p.minutes })}
                  sx={{ fontWeight: 700, borderRadius: 2 }} />
              ))}
            </Stack>
            <TextField size="small" type="number" label="أو أدخل دقائق مخصصة" value={form.everyMinutes}
              onChange={e => setForm({ ...form, everyMinutes: Number(e.target.value) })}
              error={!!errors.everyMinutes} helperText={errors.everyMinutes}
              inputProps={{ min: 1 }} sx={{ width: 200, "& .MuiOutlinedInput-root": { borderRadius: 2.5 } }} />
          </Box>

          {/* Time window */}
          <Box>
            <Typography variant="caption" color="text.secondary" fontWeight={700} sx={{ display: "block", mb: 1 }}>نافذة التنبيه</Typography>
            <Stack direction="row" spacing={1.5}>
              <TextField size="small" type="time" label="من" value={form.startTime}
                onChange={e => setForm({ ...form, startTime: e.target.value })}
                InputLabelProps={{ shrink: true }} sx={{ flex: 1, "& .MuiOutlinedInput-root": { borderRadius: 2.5 } }} />
              <TextField size="small" type="time" label="إلى" value={form.endTime}
                onChange={e => setForm({ ...form, endTime: e.target.value })}
                InputLabelProps={{ shrink: true }} sx={{ flex: 1, "& .MuiOutlinedInput-root": { borderRadius: 2.5 } }} />
            </Stack>
          </Box>

          <FormControlLabel
            control={<Switch checked={form.enabled} onChange={e => setForm({ ...form, enabled: e.target.checked })} color="primary" />}
            label={<Typography fontWeight={700} fontSize={14}>تفعيل التنبيه فورًا</Typography>} />

          {/* Actions */}
          <Stack direction={{ xs: "column", md: "row" }} spacing={1}>
            <Button fullWidth variant="contained" onClick={submit} sx={{ borderRadius: 2.5, fontWeight: 800 }}>
              حفظ التنبيه
            </Button>
            <Button fullWidth variant="outlined"
              color={notifStatus === "granted" ? "success" : notifStatus === "denied" ? "error" : "primary"}
              onClick={requestNotifications} sx={{ borderRadius: 2.5 }}>
              {notifStatus === "granted" ? "✅ الإشعارات مفعلة" : notifStatus === "denied" ? "❌ رُفض الإذن" : "تفعيل إشعارات المتصفح"}
            </Button>
          </Stack>
        </Stack>
      </SectionCard>

      <SectionCard title={`التنبيهات المسجلة (${sortedReminders.length})`}>
        {sortedReminders.length === 0 ? (
          <Box sx={{ py: 3, textAlign: "center" }}>
            <Typography fontSize={32} sx={{ mb: 1 }}>⏰</Typography>
            <Typography color="text.secondary" fontWeight={600}>لا توجد تنبيهات بعد</Typography>
            <Typography variant="caption" color="text.secondary">أضف تنبيهًا من الأعلى لتذكيرك بالرضاعة والحفاضات</Typography>
          </Box>
        ) : (
          <Stack spacing={1.25}>
            {sortedReminders.map(r => (
              <Box key={r.id} sx={{
                p: 1.5, borderRadius: 2.5, border: `1.5px solid ${r.enabled ? "#bfdbfe" : "#e2e8f0"}`,
                bgcolor: r.enabled ? "#eff6ff" : "#f8fafc",
                display: "flex", alignItems: "center", gap: 1.5
              }}>
                <Box sx={{ width: 40, height: 40, borderRadius: 2, bgcolor: r.enabled ? "#2563eb" : "#94a3b8",
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>
                  ⏰
                </Box>
                <Box sx={{ flex: 1, minWidth: 0 }}>
                  <Typography fontWeight={800} fontSize={14} sx={{ color: r.enabled ? "#1e3a8a" : "#64748b", textAlign: "right" }}>
                    {r.title}
                  </Typography>
                  <Stack direction="row" spacing={0.75} sx={{ mt: 0.4, justifyContent: "flex-end" }} useFlexGap flexWrap="wrap">
                    <Chip size="small" label={`كل ${formatMinutes(r.everyMinutes)}`}
                      sx={{ bgcolor: r.enabled ? "#dbeafe" : "#e2e8f0", color: r.enabled ? "#1d4ed8" : "#64748b", fontWeight: 700, fontSize: 11, height: 20 }} />
                    <Chip size="small" label={`${r.startTime} – ${r.endTime}`}
                      sx={{ bgcolor: "#f1f5f9", color: "#475569", fontWeight: 600, fontSize: 11, height: 20 }} />
                    <Chip size="small" label={r.enabled ? "مفعل" : "متوقف"}
                      sx={{ bgcolor: r.enabled ? "#dcfce7" : "#fee2e2", color: r.enabled ? "#16a34a" : "#dc2626", fontWeight: 700, fontSize: 11, height: 20 }} />
                  </Stack>
                </Box>
                <Button size="small" color="error" variant="outlined"
                  onClick={() => remove(r.id)}
                  sx={{ borderRadius: 2, minWidth: 40, px: 0.75, flexShrink: 0, fontSize: 16, border: "1px solid #fecaca" }}>
                  🗑
                </Button>
              </Box>
            ))}
          </Stack>
        )}
      </SectionCard>
    </>
  );
}

function Settings({ data, saveSettings, apiUrl, setApiUrl, saveApiUrl, syncFromCloud, setSyncPaused }) {
  const [settings, setSettings] = React.useState(data.settings);
  const [saved, setSaved] = React.useState(false);
  React.useEffect(() => { setSyncPaused(true); return () => setSyncPaused(false); }, []);
  React.useEffect(() => setSettings(data.settings), [data.settings]);

  // Compute baby age and ml/kg target
  const latestWeight = data.weights && data.weights.length > 0
    ? safeNumber([...data.weights].sort((a, b) => (`${toDateKey(b.date)} ${toTimeKey(b.time)}`).localeCompare(`${toDateKey(a.date)} ${toTimeKey(a.time)}`))[0].grams)
    : null;
  const targetMlDay = latestWeight && settings.targetMlPerKg
    ? Math.round((latestWeight / 1000) * safeNumber(settings.targetMlPerKg))
    : null;
  const ageText = React.useMemo(() => {
    if (!settings.birthDate) return null;
    const birth = new Date(settings.birthDate);
    const now = new Date();
    const totalDays = Math.floor((now - birth) / 86400000);
    if (totalDays < 0) return null;
    const weeks = Math.floor(totalDays / 7);
    const days = totalDays % 7;
    if (weeks < 8) return `${weeks} أسبوع${days > 0 ? ` و ${days} أيام` : ""}`;
    const months = Math.floor(totalDays / 30.44);
    const remDays = Math.floor(totalDays - months * 30.44);
    return `${months} شهر${remDays > 3 ? ` و ${remDays} يومًا` : ""}`;
  }, [settings.birthDate]);

  function handleSave() {
    saveSettings(settings);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  }

  const inputSx = { "& .MuiOutlinedInput-root": { borderRadius: 2.5 } };

  return (
    <>
      {/* Baby info summary strip */}
      {(settings.babyName || ageText || latestWeight) && (
        <Paper elevation={0} sx={{ p: 2, mb: 2, borderRadius: 3, border: "1px solid #bfdbfe", bgcolor: "#eff6ff",
          display: "flex", alignItems: "center", gap: 2, flexWrap: "wrap" }}>
          <Box sx={{ width: 44, height: 44, borderRadius: "50%", bgcolor: "#2563eb", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0 }}>
            👶
          </Box>
          <Box sx={{ flex: 1, minWidth: 0 }}>
            {settings.babyName && <Typography fontWeight={900} fontSize={16} color="#1e3a8a">{settings.babyName}</Typography>}
            <Stack direction="row" spacing={1} useFlexGap flexWrap="wrap" sx={{ mt: 0.25 }}>
              {ageText && <Chip size="small" label={`العمر: ${ageText}`} sx={{ bgcolor: "#dbeafe", color: "#1d4ed8", fontWeight: 700, fontSize: 11, height: 20 }} />}
              {latestWeight && <Chip size="small" label={`آخر وزن: ${latestWeight} g`} sx={{ bgcolor: "#dbeafe", color: "#1d4ed8", fontWeight: 700, fontSize: 11, height: 20 }} />}
              {targetMlDay && <Chip size="small" label={`هدف الطبيب: ${targetMlDay} ml/يوم`} sx={{ bgcolor: "#dcfce7", color: "#16a34a", fontWeight: 700, fontSize: 11, height: 20 }} />}
            </Stack>
          </Box>
        </Paper>
      )}

      <SectionCard title="معلومات الطفلة">
        <Stack spacing={2}>
          <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr", md: "1fr 1fr" }, gap: 2 }}>
            <TextField fullWidth label="اسم الطفلة" value={settings.babyName || ""}
              onChange={e => setSettings({ ...settings, babyName: e.target.value })} sx={inputSx} />
            <TextField fullWidth type="date" label="تاريخ الميلاد" value={settings.birthDate || ""}
              onChange={e => setSettings({ ...settings, birthDate: e.target.value })}
              InputLabelProps={{ shrink: true }} sx={inputSx} />
          </Box>
          <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr 1fr", md: "1fr 1fr 1fr" }, gap: 2 }}>
            <TextField fullWidth type="number" label="وزن الولادة (g)" value={settings.birthWeight || ""}
              onChange={e => setSettings({ ...settings, birthWeight: e.target.value })} sx={inputSx} />
            <TextField fullWidth label="عمر الحمل (أسابيع)" value={settings.gestationalAgeWeeks || ""}
              onChange={e => setSettings({ ...settings, gestationalAgeWeeks: e.target.value })} sx={inputSx} />
            <TextField fullWidth type="number" label="هدف الطبيب (ml/kg/day)" value={settings.targetMlPerKg || ""}
              onChange={e => setSettings({ ...settings, targetMlPerKg: e.target.value })}
              helperText={targetMlDay ? `= ${targetMlDay} ml/يوم بناءً على آخر وزن` : "ادخل الوزن الحالي لحساب الهدف"}
              sx={inputSx} />
          </Box>
          <Button variant={saved ? "contained" : "contained"} color={saved ? "success" : "primary"}
            onClick={handleSave} sx={{ borderRadius: 2.5, fontWeight: 800, alignSelf: "flex-start", px: 4 }}>
            {saved ? "✅ تم الحفظ" : "حفظ الإعدادات"}
          </Button>
        </Stack>
      </SectionCard>

      <SectionCard title="ربط Google Sheets ☁️">
        <Stack spacing={2}>
          <Alert severity="info" icon={false} sx={{ borderRadius: 2.5, fontSize: 13, bgcolor: "#f0f9ff", border: "1px solid #bae6fd", color: "#0c4a6e" }}>
            ضع رابط Google Apps Script هنا أو في Netlify كـ <strong>GOOGLE_SCRIPT_URL</strong>. المزامنة تلقائية كل 10 ثواني.
          </Alert>
          <TextField fullWidth label="Google Apps Script URL"
            value={apiUrl} onChange={e => setApiUrl(e.target.value)}
            placeholder="https://script.google.com/macros/s/…/exec"
            sx={inputSx} />
          <Stack direction={{ xs: "column", md: "row" }} spacing={1}>
            <Button variant="contained" onClick={saveApiUrl} sx={{ borderRadius: 2.5, fontWeight: 800 }}>حفظ الرابط</Button>
            <Button variant="outlined" onClick={() => syncFromCloud({ silent: false, force: true })} sx={{ borderRadius: 2.5 }}>
              اختبار المزامنة
            </Button>
          </Stack>
        </Stack>
      </SectionCard>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <MaterialUI.ThemeProvider theme={theme}>
    <CssBaseline />
    <App />
  </MaterialUI.ThemeProvider>
);
</script>
</body>
</html>
