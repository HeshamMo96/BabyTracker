<script type="text/babel">
const {
  AppBar, Toolbar, Typography, Box, Container, Paper, Card, CardContent, Button,
  BottomNavigation, BottomNavigationAction, TextField, MenuItem, Grid, Stack,
  Chip, Alert, Snackbar, IconButton, Divider, Switch, FormControlLabel, Dialog,
  DialogTitle, DialogContent, DialogActions, CircularProgress, Tabs, Tab,
  Drawer, List, ListItemButton, ListItemIcon, ListItemText, Fab, SpeedDial, SpeedDialAction,
  useMediaQuery, CssBaseline
} = MaterialUI;


const API_STORAGE_KEY = "baby_tracker_api_url_v2";
const LOCAL_STORAGE_KEY = "baby_tracker_offline_cache_v2";

const FEED_TYPES = ["طبيعي مباشر", "لبن أم مشفوط", "صناعي", "مختلط"];
const DIAPER_TYPES = ["بول", "براز", "بول + براز", "ناشفة"];

const NAV_ITEMS = [
  { value: "dashboard", label: "الرئيسية", icon: "🏠" },
  { value: "feed", label: "رضعة", icon: "🍼" },
  { value: "diaper", label: "حفاضة", icon: "🧷" },
  { value: "weight", label: "وزن", icon: "⚖️" },
  { value: "reports", label: "تقارير", icon: "📊" },
  { value: "reminders", label: "تنبيهات", icon: "⏰" },
  { value: "settings", label: "إعدادات", icon: "⚙️" }
];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function nowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function toDateKey(value) {
  if (value === null || value === undefined || value === "") return "";

  // Use LOCAL date parts to avoid timezone shifting 2026-05-17 to 2026-05-16
  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    const y = value.getFullYear();
    const m = String(value.getMonth() + 1).padStart(2, "0");
    const d = String(value.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  // Google Sheets serial date number
  if (typeof value === "number" && Number.isFinite(value) && value > 20000 && value < 80000) {
    const utc = new Date(Math.round((value - 25569) * 86400 * 1000));
    const y = utc.getUTCFullYear();
    const m = String(utc.getUTCMonth() + 1).padStart(2, "0");
    const d = String(utc.getUTCDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  let s = String(value).trim();
  if (!s) return "";

  const arabicDigits = "٠١٢٣٤٥٦٧٨٩";
  const easternDigits = "۰۱۲۳۴۵۶۷۸۹";
  s = s.replace(/[٠-٩]/g, d => String(arabicDigits.indexOf(d)))
       .replace(/[۰-۹]/g, d => String(easternDigits.indexOf(d)))
       .replace(/\s+/g, " ")
       .trim();

  // ISO datetime strings from Apps Script can be shifted to the previous UTC day.
  // Parse them as Date and use the user's local date parts.
  if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}T/.test(s)) {
    const parsedIso = new Date(s);
    if (!Number.isNaN(parsedIso.getTime())) {
      const y = parsedIso.getFullYear();
      const mo = String(parsedIso.getMonth() + 1).padStart(2, "0");
      const da = String(parsedIso.getDate()).padStart(2, "0");
      return `${y}-${mo}-${da}`;
    }
  }

  // Plain ISO/date strings: 2026-05-17
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if (m) {
    return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  }

  // Common browser Date string: Sun May 17 2026 ...
  const parsed = new Date(s);
  if (!Number.isNaN(parsed.getTime()) && /[A-Za-z]{3,}|GMT|UTC/.test(s)) {
    const y = parsed.getFullYear();
    const mo = String(parsed.getMonth() + 1).padStart(2, "0");
    const da = String(parsed.getDate()).padStart(2, "0");
    return `${y}-${mo}-${da}`;
  }

  // 17 - 05 - 2026, 17/05/2026, 05/17/2026
  m = s.match(/^(\d{1,2})\s*[-\/]\s*(\d{1,2})\s*[-\/]\s*(\d{4})/);
  if (m) {
    let a = Number(m[1]);
    let b = Number(m[2]);
    let day, month;

    if (a > 12) {
      day = a; month = b;
    } else if (b > 12) {
      day = b; month = a;
    } else {
      // Arabic/Egypt default: day/month/year
      day = a; month = b;
    }

    return `${m[3]}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  }

  return s.slice(0, 10);
}

function toTimeKey(value) {
  if (value === null || value === undefined || value === "") return "";

  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    return `${String(value.getHours()).padStart(2,"0")}:${String(value.getMinutes()).padStart(2,"0")}`;
  }

  // Google Sheets time serial, e.g. 0.291666 = 07:00
  if (typeof value === "number" && Number.isFinite(value) && value >= 0 && value < 1) {
    const total = Math.round(value * 24 * 60);
    return `${String(Math.floor(total / 60)).padStart(2,"0")}:${String(total % 60).padStart(2,"0")}`;
  }

  let s = String(value).trim();
  if (!s) return "";

  const arabicDigits = "٠١٢٣٤٥٦٧٨٩";
  const easternDigits = "۰۱۲۳۴۵۶۷۸۹";
  s = s.replace(/[٠-٩]/g, d => String(arabicDigits.indexOf(d)))
       .replace(/[۰-۹]/g, d => String(easternDigits.indexOf(d)))
       .trim();

  // ISO datetime from Apps Script: parse as Date and use local time.
  if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}T/.test(s)) {
    const parsedIso = new Date(s);
    if (!Number.isNaN(parsedIso.getTime())) {
      return `${String(parsedIso.getHours()).padStart(2,"0")}:${String(parsedIso.getMinutes()).padStart(2,"0")}`;
    }
  }

  // HH:mm or H:mm
  let m = s.match(/^(\d{1,2}):(\d{2})/);
  if (m) return `${String(m[1]).padStart(2,"0")}:${m[2]}`;

  // Browser Date string containing HH:mm
  m = s.match(/\b(\d{1,2}):(\d{2})(?::\d{2})?\b/);
  if (m) return `${String(m[1]).padStart(2,"0")}:${m[2]}`;

  // Last resort: never show 1899 as time
  if (s.startsWith("1899") || s.startsWith("1900")) return "";

  return s.slice(0, 5);
}
function sameDate(a, b) {
  return toDateKey(a) === toDateKey(b);
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function minutesSince(date, time) {
  if (!date || !time) return null;
  const t = new Date(`${date}T${time}:00`);
  if (Number.isNaN(t.getTime())) return null;
  return Math.floor((Date.now() - t.getTime()) / 60000);
}
function humanSince(minutes) {
  if (minutes === null) return "غير متاح";
  if (minutes < 0) return "الآن";
  if (minutes < 60) return `منذ ${minutes} دقيقة`;
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return `منذ ${h} ساعة${m ? ` و${m} دقيقة` : ""}`;
}
function safeNumber(v) {
  const n = Number(v || 0);
  return Number.isFinite(n) ? n : 0;
}
function getLocalData() {
  try {
    return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || initialData();
  } catch {
    return initialData();
  }
}
function setLocalData(data) {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
}
function initialData() {
  return {
    settings: {
      babyName: "بنتي",
      birthDate: "",
      birthWeight: 1680,
      gestationalAgeWeeks: "",
      targetMlPerKg: ""
    },
    feeds: [],
    diapers: [],
    weights: [],
    events: [],
    reminders: []
  };
}

function normalizeRemoteData(remote) {
  const base = { ...initialData(), ...(remote || {}) };

  base.feeds = (base.feeds || []).map(x => ({
    ...x,
    id: x.id || uid(),
    date: toDateKey(x.date),
    time: toTimeKey(x.time),
    knownMl: x.knownMl ?? x.ml ?? 0,
    directMinutes: x.directMinutes ?? x.minutes ?? 0
  }));

  base.diapers = (base.diapers || []).map(x => ({
    ...x,
    id: x.id || uid(),
    date: toDateKey(x.date),
    time: toTimeKey(x.time),
    stoolColor: x.stoolColor ?? x.color ?? "",
    stoolTexture: x.stoolTexture ?? x.texture ?? ""
  }));

  base.weights = (base.weights || []).map(x => ({
    ...x,
    id: x.id || uid(),
    date: toDateKey(x.date),
    time: toTimeKey(x.time)
  }));

  base.events = base.events || [];
  base.reminders = base.reminders || [];
  base.settings = base.settings || {};

  return base;
}


function normalizeAppsScriptUrl(url) {
  const clean = String(url || "").trim();
  if (!clean) return "";
  return clean.replace(/\/dev(\?|$)/, "/exec$1");
}

function apiRequest(action, payload = {}) {
  const apiUrl = normalizeAppsScriptUrl(localStorage.getItem(API_STORAGE_KEY));
  if (!apiUrl) {
    throw new Error("لم يتم ضبط رابط Google Apps Script بعد. ضع رابط /exec في الإعدادات.");
  }

  // GitHub Pages is static hosting only, so we use JSONP instead of fetch/POST.
  // This avoids browser CORS restrictions when calling Google Apps Script.
  return new Promise((resolve, reject) => {
    const callbackName = "babyTrackerCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("انتهت مهلة الاتصال بـ Google Apps Script. تأكد من رابط /exec والصلاحيات."));
    }, 45000);

    function cleanup() {
      clearTimeout(timeout);
      try { delete window[callbackName]; } catch {}
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = (json) => {
      cleanup();
      if (!json || !json.ok) {
        reject(new Error((json && json.error) || "حدث خطأ في الاتصال"));
        return;
      }
      resolve(json.data);
    };

    try {
      const url = new URL(apiUrl);
      url.searchParams.set("action", action);
      url.searchParams.set("payload", JSON.stringify(payload));
      url.searchParams.set("callback", callbackName);
      url.searchParams.set("_", String(Date.now()));

      script.onerror = () => {
        cleanup();
        reject(new Error("تعذر الاتصال بـ Google Apps Script. تأكد أن الرابط ينتهي بـ /exec وأن الوصول Anyone with the link."));
      };

      script.src = url.toString();
      document.body.appendChild(script);
    } catch (e) {
      cleanup();
      reject(new Error("رابط Google Apps Script غير صحيح."));
    }
  });
}


function calcSummary(data, date) {
  const feeds = data.feeds.filter(x => sameDate(x.date, date));
  const diapers = data.diapers.filter(x => sameDate(x.date, date));
  const weights = [...data.weights].sort((a,b) => (`${toDateKey(b.date)} ${toTimeKey(b.time)}`).localeCompare(`${toDateKey(a.date)} ${toTimeKey(a.time)}`));
  const lastWeight = weights[0];

  const knownMl = feeds.reduce((s,x)=>s + safeNumber(x.knownMl), 0);
  const directFeeds = feeds.filter(x => x.type === "طبيعي مباشر");
  const pumpedFeeds = feeds.filter(x => x.type === "لبن أم مشفوط");
  const formulaFeeds = feeds.filter(x => x.type === "صناعي");
  const mixedFeeds = feeds.filter(x => x.type === "مختلط");

  const directMinutes = directFeeds.reduce((s,x)=>s + safeNumber(x.directMinutes), 0);
  const pumpedMl = pumpedFeeds.reduce((s,x)=>s + safeNumber(x.knownMl), 0);
  const formulaMl = formulaFeeds.reduce((s,x)=>s + safeNumber(x.knownMl), 0);
  const mixedMl = mixedFeeds.reduce((s,x)=>s + safeNumber(x.knownMl), 0);

  const wet = diapers.filter(x => String(x.type).includes("بول")).length;
  const stool = diapers.filter(x => String(x.type).includes("براز")).length;
  const weight = lastWeight ? safeNumber(lastWeight.grams) : 0;
  const mlkg = weight ? Math.round((knownMl / (weight / 1000)) * 10) / 10 : 0;

  const lastFeed = [...feeds].sort((a,b)=>String(b.time).localeCompare(String(a.time)))[0];
  const lastDiaper = [...diapers].sort((a,b)=>String(b.time).localeCompare(String(a.time)))[0];

  return {
    feeds, diapers,
    knownMl, directMinutes, wet, stool, weight, mlkg,
    lastFeed, lastDiaper,
    feedCount: feeds.length,
    directFeedCount: directFeeds.length,
    pumpedFeedCount: pumpedFeeds.length,
    formulaFeedCount: formulaFeeds.length,
    mixedFeedCount: mixedFeeds.length,
    pumpedMl, formulaMl, mixedMl
  };
}

function buildDailySeries(data, days = 14) {
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const date = d.toISOString().slice(0,10);
    const s = calcSummary(data, date);
    const wForDate = data.weights
      .filter(x => toDateKey(x.date) <= date)
      .sort((a,b) => (`${toDateKey(b.date)} ${toTimeKey(b.time)}`).localeCompare(`${toDateKey(a.date)} ${toTimeKey(a.time)}`))[0];
    out.push({
      date: date.slice(5),
      fullDate: date,
      knownMl: s.knownMl,
      wet: s.wet,
      stool: s.stool,
      feeds: s.feeds.length,
      directMinutes: s.directMinutes,
      weight: wForDate ? safeNumber(wForDate.grams) : null
    });
  }
  return out;
}

function dateRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days + 1);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}
function inLastDays(item, days) {
  const { start, end } = dateRange(days);
  const key = toDateKey(item.date);
  return key >= start && key <= end;
}
function average(arr) {
  if (!arr.length) return 0;
  return arr.reduce((a,b)=>a + safeNumber(b),0) / arr.length;
}
function round1(n) {
  return Math.round(safeNumber(n) * 10) / 10;
}
function groupByDate(items, days) {
  const map = {};
  buildDailySeries({ feeds: [], diapers: [], weights: [] }, days).forEach(x => map[x.fullDate] = []);
  items.filter(x => inLastDays(x, days)).forEach(x => {
    const key = toDateKey(x.date);
    if (!map[key]) map[key] = [];
    map[key].push(x);
  });
  return map;
}
function getReportStats(data, days) {
  const series = buildDailySeries(data, days);
  const feeds = data.feeds.filter(x => inLastDays(x, days));
  const diapers = data.diapers.filter(x => inLastDays(x, days));
  const weights = data.weights.filter(x => inLastDays(x, days)).sort((a,b)=>(`${toDateKey(a.date)} ${toTimeKey(a.time)}`).localeCompare(`${toDateKey(b.date)} ${toTimeKey(b.time)}`));

  const direct = feeds.filter(x => x.type === "طبيعي مباشر");
  const bottle = feeds.filter(x => x.type !== "طبيعي مباشر");
  const pumped = feeds.filter(x => x.type === "لبن أم مشفوط");
  const formula = feeds.filter(x => x.type === "صناعي");
  const mixed = feeds.filter(x => x.type === "مختلط");

  const knownMl = feeds.reduce((s,x)=>s + safeNumber(x.knownMl),0);
  const directMinutes = feeds.reduce((s,x)=>s + safeNumber(x.directMinutes),0);
  const wet = diapers.filter(x => String(x.type).includes("بول")).length;
  const stool = diapers.filter(x => String(x.type).includes("براز")).length;

  let gain = null, gainPerDay = null;
  if (weights.length >= 2) {
    const first = weights[0], last = weights[weights.length - 1];
    const diffDays = Math.max(1, Math.round((new Date(toDateKey(last.date)) - new Date(toDateKey(first.date))) / 86400000));
    gain = safeNumber(last.grams) - safeNumber(first.grams);
    gainPerDay = gain / diffDays;
  }

  const dailyKnown = series.map(x => x.knownMl);
  const dailyWet = series.map(x => x.wet);
  const dailyStool = series.map(x => x.stool);
  const dailyFeeds = series.map(x => x.feeds);

  const feedHours = feeds
    .map(x => safeNumber(String(x.time || "00:00").split(":")[0]))
    .filter(x => Number.isFinite(x));

  const nightFeeds = feedHours.filter(h => h >= 0 && h < 6).length;
  const morningFeeds = feedHours.filter(h => h >= 6 && h < 12).length;
  const afternoonFeeds = feedHours.filter(h => h >= 12 && h < 18).length;
  const eveningFeeds = feedHours.filter(h => h >= 18 && h <= 23).length;

  return {
    series, feeds, diapers, weights,
    knownMl, directMinutes, wet, stool,
    direct, bottle, pumped, formula, mixed,
    gain, gainPerDay,
    avgKnown: average(dailyKnown),
    avgWet: average(dailyWet),
    avgStool: average(dailyStool),
    avgFeeds: average(dailyFeeds),
    maxKnown: Math.max(0, ...dailyKnown),
    minKnown: Math.min(...dailyKnown.filter(x=>x>0), 0) || 0,
    nightFeeds, morningFeeds, afternoonFeeds, eveningFeeds
  };
}
function buildDoctorSummary(data, days) {
  const s = getReportStats(data, days);
  const lines = [];
  lines.push(`تقرير آخر ${days} يوم`);
  lines.push(`عدد الرضعات المسجلة: ${s.feeds.length}`);
  lines.push(`متوسط الرضعات يوميًا: ${round1(s.avgFeeds)}`);
  lines.push(`إجمالي الكمية المعروفة: ${s.knownMl} ml`);
  lines.push(`متوسط الكمية المعروفة يوميًا: ${round1(s.avgKnown)} ml/day`);
  lines.push(`رضاعة طبيعية مباشرة: ${s.direct.length} مرة، إجمالي مدة ${s.directMinutes} دقيقة`);
  lines.push(`رضعات ببرونة/كمية معروفة: ${s.bottle.length} مرة`);
  lines.push(`حفاضات بول: ${s.wet}، متوسط ${round1(s.avgWet)} يوميًا`);
  lines.push(`حفاضات براز: ${s.stool}، متوسط ${round1(s.avgStool)} يوميًا`);
  if (s.weights.length) {
    lines.push(`قياسات الوزن: ${s.weights.length}`);
    lines.push(`آخر وزن: ${s.weights[s.weights.length - 1].grams} g بتاريخ ${toDateKey(s.weights[s.weights.length - 1].date)}`);
  }
  if (s.gain !== null) {
    lines.push(`فرق الوزن خلال الفترة: ${s.gain} g`);
    lines.push(`متوسط الزيادة التقريبي: ${round1(s.gainPerDay)} g/day`);
  }
  lines.push(`ملاحظة: إجمالي اللبن المعروف لا يشمل كمية الرضاعة الطبيعية المباشرة من صدر الأم.`);
  return lines.join("\n");
}

function fmtMin(m) {
  if (!m) return "0 دقيقة";
  if (m < 60) return `${m} دقيقة`;
  const h = Math.floor(m / 60), r = m % 60;
  return `${h} س${r ? ` ${r} د` : ""}`;
}
function fmtTime(date, time) {
  const t = toTimeKey(time);
  return t || "—";
}
function getLast24hStats(data) {
  const h24 = 24 * 3600 * 1000;
  const now = Date.now();
  function inW(x) {
    const t = new Date(`${toDateKey(x.date)}T${toTimeKey(x.time)||"00:00"}:00`).getTime();
    return now - t <= h24 && t <= now;
  }
  const byTime = (a, b) => (`${toDateKey(a.date)} ${toTimeKey(a.time)||"00:00"}`).localeCompare(`${toDateKey(b.date)} ${toTimeKey(b.time)||"00:00"}`);
  const feeds   = data.feeds.filter(inW).sort(byTime);
  const diapers = data.diapers.filter(inW).sort(byTime);
  const intervals = [];
  for (let i = 1; i < feeds.length; i++) {
    const prev = new Date(`${toDateKey(feeds[i-1].date)}T${toTimeKey(feeds[i-1].time)||"00:00"}:00`).getTime();
    const curr = new Date(`${toDateKey(feeds[i].date)}T${toTimeKey(feeds[i].time)||"00:00"}:00`).getTime();
    const d = Math.round((curr - prev) / 60000);
    if (d > 0 && d < 600) intervals.push(d);
  }
  const avgInterval = intervals.length ? Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length) : null;
  const maxInterval = intervals.length ? Math.max(...intervals) : null;
  const lastFeed   = feeds[feeds.length-1] || null;
  const lastDiaper = diapers[diapers.length-1] || null;
  let predictedNext = null;
  if (lastFeed && avgInterval) {
    const lt = new Date(`${toDateKey(lastFeed.date)}T${toTimeKey(lastFeed.time)||"00:00"}:00`).getTime();
    predictedNext = new Date(lt + avgInterval * 60000);
  }
  const totalMl       = feeds.reduce((s,x)=>s+safeNumber(x.knownMl),0);
  const totalDirectMin= feeds.reduce((s,x)=>s+safeNumber(x.directMinutes),0);
  const wet   = diapers.filter(x=>String(x.type).includes("بول")).length;
  const stool = diapers.filter(x=>String(x.type).includes("براز")).length;
  const timeline = [
    ...feeds.map(x=>({...x, kind:"feed"})),
    ...diapers.map(x=>({...x, kind:"diaper"})),
  ].sort(byTime);
  return { feeds, diapers, totalMl, totalDirectMin, wet, stool, avgInterval, maxInterval, lastFeed, lastDiaper, predictedNext, intervals, timeline };
}

function getFeedingRhythm(feeds) {
  const sorted = [...feeds].sort((a,b)=>(`${toDateKey(a.date)} ${toTimeKey(a.time)||"00:00"}`).localeCompare(`${toDateKey(b.date)} ${toTimeKey(b.time)||"00:00"}`));
  const intervals = [];
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(`${toDateKey(sorted[i-1].date)}T${toTimeKey(sorted[i-1].time)||"00:00"}:00`).getTime();
    const curr = new Date(`${toDateKey(sorted[i].date)}T${toTimeKey(sorted[i].time)||"00:00"}:00`).getTime();
    const d = Math.round((curr - prev) / 60000);
    if (d > 0 && d < 600) intervals.push(d);
  }
  if (!intervals.length) return null;
  const avg = Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length);
  const max = Math.max(...intervals);
  const min = Math.min(...intervals);
  const variance = intervals.reduce((s,x)=>s+Math.pow(x-avg,2),0)/intervals.length;
  const cv = Math.sqrt(variance)/avg;
  const consistency = cv < 0.25 ? "منتظم جداً" : cv < 0.45 ? "منتظم نسبياً" : "غير منتظم";
  const consistencySt = cv < 0.25 ? "ok" : cv < 0.45 ? "warn" : "bad";
  return { avg, max, min, consistency, consistencySt, count: intervals.length };
}

function getBreastBalance(feeds) {
  const bf = feeds.filter(x=>(x.type==="طبيعي مباشر"||x.type==="مختلط") && x.side);
  if (!bf.length) return null;
  const right = bf.filter(x=>x.side==="يمين"||x.side==="يمين وشمال").length;
  const left  = bf.filter(x=>x.side==="شمال"||x.side==="يمين وشمال").length;
  const rMins = feeds.filter(x=>(x.type==="طبيعي مباشر"||x.type==="مختلط")&&(x.side==="يمين"||x.side==="يمين وشمال")).reduce((s,x)=>s+safeNumber(x.directMinutes),0);
  const lMins = feeds.filter(x=>(x.type==="طبيعي مباشر"||x.type==="مختلط")&&(x.side==="شمال"||x.side==="يمين وشمال")).reduce((s,x)=>s+safeNumber(x.directMinutes),0);
  const total = right + left || 1;
  return { right, left, rMins, lMins, rightPct: Math.round(right/total*100), leftPct: Math.round(left/total*100) };
}

function getWeekComparison(data) {
  const now = Date.now();
  const W = 7 * 86400000;
  function inRange(x, from, to) {
    const t = new Date(`${toDateKey(x.date)}T${toTimeKey(x.time)||"00:00"}:00`).getTime();
    return t >= from && t < to;
  }
  const tF = data.feeds.filter(x=>inRange(x, now-W, now));
  const lF = data.feeds.filter(x=>inRange(x, now-2*W, now-W));
  const tD = data.diapers.filter(x=>inRange(x, now-W, now));
  const lD = data.diapers.filter(x=>inRange(x, now-2*W, now-W));
  const tMl = tF.reduce((s,x)=>s+safeNumber(x.knownMl),0);
  const lMl = lF.reduce((s,x)=>s+safeNumber(x.knownMl),0);
  const tWet  = tD.filter(x=>String(x.type).includes("بول")).length;
  const lWet  = lD.filter(x=>String(x.type).includes("بول")).length;
  const tStool= tD.filter(x=>String(x.type).includes("براز")).length;
  const lStool= lD.filter(x=>String(x.type).includes("براز")).length;
  function pct(a,b){ return b===0?null:Math.round((a-b)/b*100); }
  return {
    thisFeeds: tF.length, lastFeeds: lF.length, feedsDelta: tF.length - lF.length,
    thisMl: Math.round(tMl/7), lastMl: Math.round(lMl/7), mlPct: pct(tMl,lMl),
    thisWet: round1(tWet/7), lastWet: round1(lWet/7), wetDelta: round1((tWet-lWet)/7),
    thisStool: round1(tStool/7), lastStool: round1(lStool/7),
  };
}


function getMinRecordDate(data) {
  const dates = [
    ...(data.feeds || []).map(x => toDateKey(x.date)),
    ...(data.diapers || []).map(x => toDateKey(x.date)),
    ...(data.weights || []).map(x => toDateKey(x.date))
  ].filter(Boolean).sort();

  return dates[0] || null;
}

function addDaysKey(dateKey, days) {
  const d = new Date(`${dateKey}T00:00:00`);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function buildSeriesBetween(data, startKey, endKey) {
  if (!startKey || !endKey || startKey > endKey) return [];

  const out = [];
  let cursor = startKey;

  while (cursor <= endKey) {
    const s = calcSummary(data, cursor);
    const wForDate = data.weights
      .filter(x => toDateKey(x.date) <= cursor)
      .sort((a,b) => (`${toDateKey(b.date)} ${toTimeKey(b.time)}`).localeCompare(`${toDateKey(a.date)} ${toTimeKey(a.time)}`))[0];

    out.push({
      date: cursor.slice(5),
      fullDate: cursor,
      knownMl: s.knownMl,
      wet: s.wet,
      stool: s.stool,
      feeds: s.feeds.length,
      directMinutes: s.directMinutes,
      weight: wForDate ? safeNumber(wForDate.grams) : null
    });

    cursor = addDaysKey(cursor, 1);
  }

  return out;
}

function getHistoricalAveragesUntilYesterday(data) {
  const start = getMinRecordDate(data);
  const end = yesterdayKey();

  if (!start || start > end) {
    return {
      start,
      end,
      daysCount: 0,
      series: [],
      avgKnown: 0,
      avgWet: 0,
      avgStool: 0,
      avgFeeds: 0,
      avgDirectMinutes: 0,
      activeDays: 0
    };
  }

  const series = buildSeriesBetween(data, start, end);
  const daysCount = series.length;
  const activeDays = series.filter(x => x.feeds || x.wet || x.stool || x.knownMl || x.directMinutes).length;

  return {
    start,
    end,
    daysCount,
    series,
    activeDays,
    avgKnown: average(series.map(x => x.knownMl)),
    avgWet: average(series.map(x => x.wet)),
    avgStool: average(series.map(x => x.stool)),
    avgFeeds: average(series.map(x => x.feeds)),
    avgDirectMinutes: average(series.map(x => x.directMinutes))
  };
}

function daysBetweenKeys(startKey, endKey) {
  if (!startKey || !endKey) return 0;
  const s = new Date(`${startKey}T00:00:00`).getTime();
  const e = new Date(`${endKey}T00:00:00`).getTime();
  if (Number.isNaN(s) || Number.isNaN(e)) return 0;
  return Math.max(0, Math.round((e - s) / 86400000));
}

function getLastByPredicate(items, predicate) {
  return [...(items || [])]
    .filter(predicate)
    .sort((a,b)=>(`${toDateKey(b.date)} ${toTimeKey(b.time)||"00:00"}`).localeCompare(`${toDateKey(a.date)} ${toTimeKey(a.time)||"00:00"}`))[0] || null;
}

function getGrowthInsights(data) {
  const settings = data.settings || {};
  const weightsAsc = [...(data.weights || [])]
    .filter(x => safeNumber(x.grams) > 0 && toDateKey(x.date))
    .sort((a,b)=>(`${toDateKey(a.date)} ${toTimeKey(a.time)||"00:00"}`).localeCompare(`${toDateKey(b.date)} ${toTimeKey(b.time)||"00:00"}`));

  const firstWeight = weightsAsc[0] || null;
  const latestWeight = weightsAsc[weightsAsc.length - 1] || null;
  const prevWeight = weightsAsc.length >= 2 ? weightsAsc[weightsAsc.length - 2] : null;

  const birthWeight = safeNumber(settings.birthWeight);
  const latestG = latestWeight ? safeNumber(latestWeight.grams) : 0;
  const latestKg = latestG ? latestG / 1000 : 0;

  let ageDays = null;
  let ageText = "غير محدد";
  let correctedDays = null;
  let correctedText = "غير محدد";
  let pmaText = "غير محدد";

  if (settings.birthDate) {
    const birth = new Date(`${settings.birthDate}T00:00:00`).getTime();
    if (!Number.isNaN(birth)) {
      ageDays = Math.max(0, Math.floor((Date.now() - birth) / 86400000));
      const weeks = Math.floor(ageDays / 7);
      const days = ageDays % 7;
      ageText = weeks ? `${weeks} أسبوع و${days} يوم` : `${days} يوم`;
    }
  }

  const gaWeeks = safeNumber(settings.gestationalAgeWeeks);
  if (ageDays !== null && gaWeeks > 0) {
    const pmaWeeksRaw = gaWeeks + ageDays / 7;
    const pmaW = Math.floor(pmaWeeksRaw);
    const pmaD = Math.round((pmaWeeksRaw - pmaW) * 7);
    pmaText = `${pmaW} أسبوع و${pmaD} يوم`;

    const prematurityDays = Math.max(0, Math.round((40 - gaWeeks) * 7));
    correctedDays = ageDays - prematurityDays;
    if (correctedDays < 0) {
      correctedText = `قبل موعد الولادة المتوقع بـ ${Math.abs(correctedDays)} يوم`;
    } else {
      const cw = Math.floor(correctedDays / 7);
      const cd = correctedDays % 7;
      correctedText = cw ? `${cw} أسبوع و${cd} يوم` : `${cd} يوم`;
    }
  }

  const gainFromBirth = birthWeight && latestG ? latestG - birthWeight : null;
  const birthRecovered = birthWeight && latestG ? latestG >= birthWeight : null;
  const prevDiff = prevWeight && latestWeight ? latestG - safeNumber(prevWeight.grams) : null;

  let gainPerDay = null;
  let gainPerKgDay = null;
  if (weightsAsc.length >= 2) {
    const first = weightsAsc[0], last = weightsAsc[weightsAsc.length - 1];
    const diffDays = Math.max(1, daysBetweenKeys(toDateKey(first.date), toDateKey(last.date)));
    const gain = safeNumber(last.grams) - safeNumber(first.grams);
    gainPerDay = gain / diffDays;
    const avgKg = ((safeNumber(first.grams) + safeNumber(last.grams)) / 2) / 1000;
    gainPerKgDay = avgKg ? gainPerDay / avgKg : null;
  }

  let velocityStatus = { st: "info", label: "غير كافٍ للحكم", note: "سجل وزن مرتين أو أكثر لحساب معدل الزيادة." };
  if (gainPerKgDay !== null) {
    if (gainPerKgDay >= 15 && gainPerKgDay <= 25) velocityStatus = { st: "ok", label: "معدل زيادة مطمئن", note: "ضمن نطاق تقريبي مناسب للمبتسرين." };
    else if (gainPerKgDay >= 10 && gainPerKgDay < 15) velocityStatus = { st: "warn", label: "زيادة أقل من المرغوب", note: "يحتاج متابعة مع الطبيب حسب خطة التغذية." };
    else if (gainPerKgDay < 10) velocityStatus = { st: "bad", label: "زيادة ضعيفة", note: "ناقشها مع الطبيب، خاصة لو استمرت." };
    else velocityStatus = { st: "warn", label: "زيادة سريعة", note: "راجع طريقة القياس والرضعات، وناقشها مع الطبيب." };
  }

  let trendStatus = { st: "info", label: "لا يوجد اتجاه بعد" };
  if (prevDiff !== null) {
    if (prevDiff > 0) trendStatus = { st: "ok", label: `آخر قياس أعلى بـ ${prevDiff} g` };
    else if (prevDiff < 0) trendStatus = { st: "bad", label: `آخر قياس أقل بـ ${Math.abs(prevDiff)} g` };
    else trendStatus = { st: "warn", label: "آخر قياسين نفس الوزن" };
  }

  return {
    weightsAsc, firstWeight, latestWeight, prevWeight,
    birthWeight, latestG, latestKg,
    ageDays, ageText, correctedDays, correctedText, pmaText, gaWeeks,
    gainFromBirth, birthRecovered, prevDiff,
    gainPerDay, gainPerKgDay,
    velocityStatus, trendStatus
  };
}

function getReadyInsights(data, days, lifetimeAvg) {
  const h24 = getLast24hStats(data);
  const today = calcSummary(data, todayStr());
  const lastWet = getLastByPredicate(data.diapers, x => String(x.type).includes("بول"));
  const lastStool = getLastByPredicate(data.diapers, x => String(x.type).includes("براز"));
  const allFeeds = data.feeds || [];
  const knownFeeds = allFeeds.filter(x => safeNumber(x.knownMl) > 0);
  const directFeeds = allFeeds.filter(x => x.type === "طبيعي مباشر" || safeNumber(x.directMinutes) > 0);
  const coverage = allFeeds.length ? Math.round((knownFeeds.length / allFeeds.length) * 100) : 0;

  const lastWetMin = lastWet ? minutesSince(toDateKey(lastWet.date), toTimeKey(lastWet.time)) : null;
  const lastStoolMin = lastStool ? minutesSince(toDateKey(lastStool.date), toTimeKey(lastStool.time)) : null;

  const todayKnownVsAvg = lifetimeAvg && lifetimeAvg.avgKnown ? today.knownMl - lifetimeAvg.avgKnown : null;
  const todayFeedsVsAvg = lifetimeAvg && lifetimeAvg.avgFeeds ? today.feedCount - lifetimeAvg.avgFeeds : null;

  return {
    h24, today,
    lastWet, lastStool, lastWetMin, lastStoolMin,
    allFeeds, knownFeeds, directFeeds, coverage,
    todayKnownVsAvg, todayFeedsVsAvg
  };
}

function getWhoPercentile(grams, ageMonths) {
  if (!grams || ageMonths === null || ageMonths < 0) return null;
  const ref = [
    {m:0,  p3:2400, p15:2800, p50:3200, p85:3700, p97:4200},
    {m:1,  p3:2900, p15:3400, p50:4200, p85:5000, p97:5500},
    {m:2,  p3:3800, p15:4400, p50:5100, p85:6000, p97:6600},
    {m:3,  p3:4500, p15:5100, p50:5800, p85:6700, p97:7400},
    {m:4,  p3:4900, p15:5600, p50:6400, p85:7300, p97:8100},
    {m:5,  p3:5300, p15:6000, p50:6900, p85:7800, p97:8700},
    {m:6,  p3:5700, p15:6400, p50:7300, p85:8300, p97:9300},
    {m:9,  p3:6800, p15:7600, p50:8500, p85:9600, p97:10700},
    {m:12, p3:7600, p15:8500, p50:9500, p85:10700,p97:11900},
  ];
  const m = Math.min(12, Math.max(0, Math.round(ageMonths)));
  const row = ref.reduce((p,c)=>Math.abs(c.m-m)<Math.abs(p.m-m)?c:p, ref[0]);
  let band, bandSt, bandLabel;
  if      (grams < row.p3)  { band="< P3";     bandSt="bad";  bandLabel="أقل من المتوسط بكثير"; }
  else if (grams < row.p15) { band="P3–P15";   bandSt="warn"; bandLabel="أقل من المتوسط"; }
  else if (grams < row.p85) { band="P15–P85";  bandSt="ok";   bandLabel="ضمن المعدل الطبيعي"; }
  else if (grams < row.p97) { band="P85–P97";  bandSt="warn"; bandLabel="أعلى من المتوسط"; }
  else                      { band="> P97";    bandSt="warn"; bandLabel="أعلى من المتوسط بكثير"; }
  const diffFromP50 = grams - row.p50;
  return { band, bandSt, bandLabel, p3:row.p3, p50:row.p50, p97:row.p97, diffFromP50 };
}

function ChartCanvas({ type, labels, datasets }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);

  React.useEffect(() => {
    if (!window.Chart || !canvasRef.current) return;

    if (chartRef.current) {
      chartRef.current.destroy();
    }

    chartRef.current = new Chart(canvasRef.current, {
      type,
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "bottom", labels: { font: { family: "Cairo" } } },
          tooltip: { rtl: true, textDirection: "rtl", titleFont: { family: "Cairo" }, bodyFont: { family: "Cairo" } }
        },
        scales: type === "pie" ? {} : {
          x: { ticks: { maxRotation: 0, font: { family: "Cairo" } } },
          y: { beginAtZero: false, ticks: { font: { family: "Cairo" } } }
        }
      }
    });

    return () => {
      if (chartRef.current) chartRef.current.destroy();
    };
  }, [type, JSON.stringify(labels), JSON.stringify(datasets)]);

  if (!window.Chart) {
    return <Alert severity="warning">تعذر تحميل مكتبة الرسوم البيانية. افتح الصفحة بإنترنت أو ارفعها على استضافة.</Alert>;
  }

  return <Box sx={{ height: 300 }}><canvas ref={canvasRef}></canvas></Box>;
}

function App() {
  const [page, setPage] = React.useState("dashboard");
  const [data, setData] = React.useState(getLocalData());
  const [date, setDate] = React.useState(todayStr());
  const [loading, setLoading] = React.useState(false);
  const [lastSyncedAt, setLastSyncedAt] = React.useState("");
  const [toast, setToast] = React.useState("");
  const [syncPaused, setSyncPaused] = React.useState(false);
  const lastLocalEditRef = React.useRef(0);
  const syncingRef = React.useRef(false);
  const pendingSaveRef = React.useRef({});
  const [apiUrl, setApiUrl] = React.useState(localStorage.getItem(API_STORAGE_KEY) || "");
  const [editing, setEditing] = React.useState(null);
  const isSmall = useMediaQuery("(max-width:700px)");
  const [drawerOpen, setDrawerOpen] = React.useState(false);

  async function syncFromCloud(options = {}) {
    const silent = !!options.silent;
    const force = !!options.force;

    // لا تعمل مزامنة تلقائية أثناء الكتابة أو بعد حفظ محلي مباشر حتى لا تمسح المدخلات.
    const recentlyEdited = Date.now() - lastLocalEditRef.current < 15000;
    if (!force && (syncPaused || recentlyEdited || syncingRef.current)) return;

    syncingRef.current = true;
    setLoading(true);
    try {
      const remote = await apiRequest("getAll", {});
      const merged = normalizeRemoteData(remote);
      setData(merged);
      setLocalData(merged);
      setLastSyncedAt(new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      if (!silent) setToast("تم تحديث البيانات من Google Sheets");
    } catch (e) {
      if (!silent) setToast(e.message);
      console.warn("Auto sync failed:", e);
    } finally {
      syncingRef.current = false;
      setLoading(false);
    }
  }

  async function addCloud(action, localKey, row) {
    // حماية من الدبل كليك / ضغطتين حفظ متتاليتين لنفس نوع السجل.
    // السبب الأكثر شيوعًا لتكرار الصفوف في Google Sheets هو ضغط زر الحفظ مرتين بسرعة.
    const lockKey = action;
    if (pendingSaveRef.current[lockKey]) {
      setToast("جاري حفظ السجل بالفعل، انتظر لحظة...");
      return;
    }

    pendingSaveRef.current[lockKey] = true;

    try {
      // حفظ فوري محليًا عشان المستخدم يشوف السجل فورًا
      lastLocalEditRef.current = Date.now();
      const next = { ...data, [localKey]: [...data[localKey], row] };
      setData(next);
      setLocalData(next);

      await apiRequest(action, row);
      setLastSyncedAt(new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      setToast("تم الحفظ في Google Sheets");
      return true;
      // لا نعمل sync مباشر هنا؛ لأن السجل محفوظ محليًا بالفعل.
      // المزامنة التلقائية هتشتغل بعد 15 ثانية لتجنب مسح أي كتابة جارية.
    } catch (e) {
      setToast("تم الحفظ محليًا فقط ولم يصل للشيت: " + e.message);
      return false;
    } finally {
      setTimeout(() => {
        pendingSaveRef.current[lockKey] = false;
      }, 1200);
    }
  }
  async function deleteCloud(kind, id) {
    const config = {
      feed:   { key: "feeds",   action: "deleteFeed"   },
      diaper: { key: "diapers", action: "deleteDiaper" },
      weight: { key: "weights", action: "deleteWeight" }
    }[kind];
    if (!config || !id) return;
    lastLocalEditRef.current = Date.now();
    const next = { ...data, [config.key]: data[config.key].filter(x => x.id !== id) };
    setData(next);
    setLocalData(next);
    try {
      await apiRequest(config.action, { id });
      setToast("تم حذف السجل");
    } catch (e) {
      setToast("تم الحذف محليًا: " + e.message);
    }
  }

  async function removeReminder(id) {
    if (!id) return;
    lastLocalEditRef.current = Date.now();
    const next = { ...data, reminders: data.reminders.filter(x => x.id !== id) };
    setData(next);
    setLocalData(next);
    try {
      await apiRequest("deleteReminder", { id });
      setToast("تم حذف التنبيه");
    } catch (e) {
      setToast("تم حذف التنبيه محليًا فقط: " + e.message);
    }
  }

  async function updateCloud(kind, row) {
    const config = {
      feed: { key: "feeds", action: "updateFeed" },
      diaper: { key: "diapers", action: "updateDiaper" },
      weight: { key: "weights", action: "updateWeight" }
    }[kind];

    if (!config || !row.id) return;

    lastLocalEditRef.current = Date.now();

    const next = {
      ...data,
      [config.key]: data[config.key].map(x => x.id === row.id ? { ...x, ...row, updatedAt: new Date().toISOString() } : x)
    };

    setData(next);
    setLocalData(next);

    try {
      await apiRequest(config.action, { ...row, updatedAt: new Date().toISOString() });
      setLastSyncedAt(new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      setToast("تم تعديل السجل");
    } catch (e) {
      setToast("تم التعديل محليًا فقط ولم يصل للشيت: " + e.message);
    }
  }


  async function saveSettings(settings) {
    lastLocalEditRef.current = Date.now();
    const next = { ...data, settings };
    setData(next);
    setLocalData(next);
    try {
      await apiRequest("saveSettings", settings);
      setLastSyncedAt(new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      setToast("تم حفظ الإعدادات");
    } catch (e) {
      setToast("تم حفظ الإعدادات محليًا فقط: " + e.message);
    }
  }

  function saveApiUrl() {
    localStorage.setItem(API_STORAGE_KEY, normalizeAppsScriptUrl(apiUrl));
    setToast("تم حفظ رابط Google Apps Script");
  }

  React.useEffect(() => {
    syncFromCloud({ silent: true, force: true });
  }, []);

  React.useEffect(() => {
    const autoSyncTimer = setInterval(() => {
      const canAutoSync = page === "dashboard" || page === "reports";
      if (canAutoSync) {
        syncFromCloud({ silent: true });
      }
    }, 10000);

    return () => clearInterval(autoSyncTimer);
  }, [page, syncPaused]);

  React.useEffect(() => {
    const timer = setInterval(() => {
      const reminders = data.reminders.filter(r => r.enabled);
      const todaySummary = calcSummary(data, todayStr());
      reminders.forEach(r => {
        const key = "reminder_last_" + r.id;
        const last = Number(localStorage.getItem(key) || 0);
        const every = safeNumber(r.everyMinutes);
        if (!every) return;
        const now = Date.now();
        if (now - last > every * 60000) {
          const text = r.title || "تذكير متابعة";
          setToast(text);
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("متابعة الطفلة", { body: text });
          }
          localStorage.setItem(key, String(now));
        }
      });
    }, 30000);
    return () => clearInterval(timer);
  }, [data.reminders]);

  const summary = calcSummary(data, date);

  return (
    <Box dir="rtl" sx={{ pb: { xs: 13, md: 3 } }}>
      <AppBar position="sticky" elevation={0} sx={{ bgcolor: "#ffffffd9", color: "#111827", backdropFilter: "blur(12px)", borderBottom: "1px solid #e7ecf5", boxShadow: "0 10px 30px rgba(15,23,42,0.04)" }}>
        <Toolbar>
          <Button onClick={()=>setDrawerOpen(true)} sx={{ minWidth: 42, mr: 1, fontSize: 22 }}>☰</Button>
          <Box sx={{ flex: 1 }}>
            <Typography variant="h6" fontWeight={900}>متابعة {data.settings.babyName || "الطفلة"}</Typography>
            <Typography variant="caption" color="text.secondary">رضاعة • حفاضات • وزن • تقارير</Typography>
          </Box>
          {loading && <CircularProgress size={22} />}
        </Toolbar>
      </AppBar>

      <Container maxWidth="lg" dir="rtl" sx={{ pt: 2, pr: { md: "270px" }, pl: { md: 2 } }}>
        {page === "dashboard" && <Dashboard data={data} date={date} setDate={setDate} summary={summary} setPage={setPage} syncFromCloud={syncFromCloud} lastSyncedAt={lastSyncedAt} onEdit={setEditing} />}
        {page === "feed" && <FeedForm add={(row)=>addCloud("addFeed", "feeds", row)} setSyncPaused={setSyncPaused} />}
        {page === "diaper" && <DiaperForm add={(row)=>addCloud("addDiaper", "diapers", row)} setSyncPaused={setSyncPaused} />}
        {page === "weight" && <WeightForm add={(row)=>addCloud("addWeight", "weights", row)} setSyncPaused={setSyncPaused} />}
        {page === "reports" && <Reports data={data} />}
        {page === "reminders" && <Reminders data={data} add={(row)=>addCloud("addReminder", "reminders", row)} remove={removeReminder} setSyncPaused={setSyncPaused} />}
        {page === "settings" && <Settings data={data} saveSettings={saveSettings} apiUrl={apiUrl} setApiUrl={setApiUrl} saveApiUrl={saveApiUrl} syncFromCloud={syncFromCloud} setSyncPaused={setSyncPaused} />}
      </Container>

      <Drawer anchor="right" open={drawerOpen} onClose={()=>setDrawerOpen(false)}>
        <Box sx={{ width: 280, pt: 2 }}>
          <Typography sx={{ px: 2, mb: 1 }} variant="h6" fontWeight={900}>القائمة</Typography>
          <List>
            {NAV_ITEMS.map(item => (
              <ListItemButton
                key={item.value}
                selected={page === item.value}
                onClick={() => { setPage(item.value); setDrawerOpen(false); }}
                sx={{ mx: 1, borderRadius: 3, direction: "rtl", textAlign: "right" }}
              >
                <ListItemIcon sx={{ minWidth: 38, fontSize: 20 }}>{item.icon}</ListItemIcon>
                <ListItemText primary={item.label} />
              </ListItemButton>
            ))}
          </List>
        </Box>
      </Drawer>

      <Paper
        elevation={10}
        sx={{
          position: "fixed",
          bottom: 0,
          left: 0,
          right: 0,
          zIndex: 1200,
          borderRadius: "22px 22px 0 0",
          pb: "env(safe-area-inset-bottom)",
          display: { xs: "block", md: "none" }
        }}
      >
        <BottomNavigation
          showLabels
          value={["dashboard","feed","diaper","weight","reports"].includes(page) ? page : "dashboard"}
          onChange={(e,v)=>setPage(v)}
          sx={{
            height: 74,
            "& .MuiBottomNavigationAction-root": { minWidth: 0, px: .5 },
            "& .MuiBottomNavigationAction-label": { fontFamily: "Cairo", fontSize: 11 },
            "& .Mui-selected": { color: "#1976d2" }
          }}
        >
          {NAV_ITEMS.slice(0,5).map(item => (
            <BottomNavigationAction key={item.value} label={item.label} value={item.value} icon={<span>{item.icon}</span>} />
          ))}
        </BottomNavigation>
      </Paper>

      <Fab
        color="primary"
        onClick={()=>setDrawerOpen(true)}
        sx={{ position: "fixed", bottom: { xs: 86, md: 24 }, left: 18, display: { xs: "flex", md: "none" } }}
      >
        ☰
      </Fab>

      <Paper
        elevation={0}
        sx={{
          position: "fixed",
          top: 86,
          right: 18,
          width: 230,
          borderRadius: 4,
          border: "1px solid #e7e9f2",
          overflow: "hidden",
          display: { xs: "none", md: "block" }
        }}
      >
        <List dense>
          {NAV_ITEMS.map(item => (
            <ListItemButton
              key={item.value}
              selected={page === item.value}
              onClick={()=>setPage(item.value)}
              sx={{ mx: 1, my: .5, borderRadius: 3, direction: "rtl", textAlign: "right" }}
            >
              <ListItemIcon sx={{ minWidth: 36 }}>{item.icon}</ListItemIcon>
              <ListItemText primary={item.label} />
            </ListItemButton>
          ))}
        </List>
      </Paper>

      <EditRecordDialog
        editing={editing}
        onClose={()=>setEditing(null)}
        onSave={(kind, row) => { updateCloud(kind, row); setEditing(null); }}
        onDelete={(kind, id) => { deleteCloud(kind, id); setEditing(null); }}
      />

      <Snackbar open={!!toast} autoHideDuration={4500} onClose={()=>setToast("")} message={toast} />
    </Box>
  );
}


function Dashboard({ data, date, setDate, summary, setPage, syncFromCloud, lastSyncedAt, onEdit }) {
  const feedAgo = summary.lastFeed ? humanSince(minutesSince(summary.lastFeed.date, summary.lastFeed.time)) : "لا يوجد";
  const diaperAgo = summary.lastDiaper ? humanSince(minutesSince(summary.lastDiaper.date, summary.lastDiaper.time)) : "لا يوجد";

  const warnings = [];
  const lastFeedMinutes = summary.lastFeed ? minutesSince(summary.lastFeed.date, summary.lastFeed.time) : null;
  const lastDiaperMinutes = summary.lastDiaper ? minutesSince(summary.lastDiaper.date, summary.lastDiaper.time) : null;
  if (lastFeedMinutes !== null && lastFeedMinutes > 180) warnings.push("آخر رضعة من أكثر من 3 ساعات.");
  if (lastDiaperMinutes !== null && lastDiaperMinutes > 240) warnings.push("آخر حفاضة من أكثر من 4 ساعات.");

}

function AllRecentRecords({ data, selectedDate, onEdit }) {
  const [mainFilter, setMainFilter] = React.useState("all");
  const [subFilter, setSubFilter] = React.useState("all");

  React.useEffect(() => {
    setSubFilter("all");
  }, [mainFilter]);

  const records = [
    ...(data.feeds || []).map(x => ({...x, kind:"feed", label:"رضعة"})),
    ...(data.diapers || []).map(x => ({...x, kind:"diaper", label:"حفاضة"})),
    ...(data.weights || []).map(x => ({...x, kind:"weight", label:"وزن"}))
  ]
    .filter(x => !sameDate(x.date, selectedDate))
    .sort((a,b)=>(`${toDateKey(b.date)} ${toTimeKey(b.time) || ""}`).localeCompare(`${toDateKey(a.date)} ${toTimeKey(a.time) || ""}`));

  const filtered = records.filter(r => {
    if (mainFilter !== "all" && r.kind !== mainFilter) return false;
    if (subFilter === "all") return true;
    if (r.kind === "feed") return r.type === subFilter;
    if (r.kind === "diaper") return r.type === subFilter;
    if (r.kind === "weight") return (r.context || "بدون سياق") === subFilter;
    return true;
  }).slice(0, 30);

  let subOptions = ["all"];
  if (mainFilter === "feed") subOptions = ["all", "طبيعي مباشر", "لبن أم مشفوط", "صناعي"];
  if (mainFilter === "diaper") subOptions = ["all", ...DIAPER_TYPES];
  if (mainFilter === "weight") subOptions = ["all", "قبل الرضاعة", "بعد الرضاعة", "بعد تغيير الحفاضة", "بدون سياق"];

  if (!records.length) {
    return <Typography color="text.secondary">لا توجد سجلات سابقة غير سجلات اليوم الحالي.</Typography>;
  }

  return (
    <>
      <Stack direction={{ xs: "column", md: "row" }} spacing={1} sx={{ mb: 2 }}>
        <TextField
          select
          size="small"
          label="نوع السجل"
          value={mainFilter}
          onChange={e=>setMainFilter(e.target.value)}
          sx={{ minWidth: 180 }}
        >
          <MenuItem value="all">الكل</MenuItem>
          <MenuItem value="feed">رضعات</MenuItem>
          <MenuItem value="diaper">حفاضات</MenuItem>
          <MenuItem value="weight">أوزان</MenuItem>
        </TextField>

        <TextField
          select
          size="small"
          label="تفصيل النوع"
          value={subFilter}
          onChange={e=>setSubFilter(e.target.value)}
          sx={{ minWidth: 200 }}
        >
          <MenuItem value="all">الكل</MenuItem>
          {subOptions.filter(x => x !== "all").map(option => (
            <MenuItem key={option} value={option}>{option}</MenuItem>
          ))}
        </TextField>

        <Chip variant="outlined" label={`المعروض ${filtered.length} من أصل ${records.length} سجل سابق`} sx={{ width: "fit-content" }} />
      </Stack>

      <Stack spacing={1.5}>
        {filtered.map(r => (
          <Paper
            key={`${r.kind}-${r.id}`}
            elevation={0}
            sx={{
              p: 1.5,
              borderRadius: 3,
              border: "1px solid #e7ecf5",
              background: "linear-gradient(180deg, #ffffff 0%, #fafcff 100%)",
              boxShadow: "0 2px 8px rgba(15,23,42,0.04)"
            }}
          >
            <Stack direction="row" alignItems="flex-start" spacing={1}>
              <Box sx={{ flex: 1, minWidth: 0 }}>
                <Stack direction="row" spacing={0.75} alignItems="center" useFlexGap flexWrap="wrap" sx={{ mb: 0.6 }}>
                  <Chip
                    size="small"
                    label={r.label}
                    sx={{
                      bgcolor: r.kind === "feed" ? "#eff6ff" : r.kind === "diaper" ? "#f0fdfa" : "#fff7ed",
                      color: r.kind === "feed" ? "#1d4ed8" : r.kind === "diaper" ? "#0f766e" : "#c2410c",
                      fontWeight: 800
                    }}
                  />
                  <Chip size="small" variant="outlined" label={`${toDateKey(r.date)} • ${toTimeKey(r.time) || "--:--"}`} />
                  <Chip size="small" variant="outlined" label={r.kind === "weight" ? (r.context || "وزن") : r.type} />
                </Stack>
                <Stack direction="row" spacing={1} useFlexGap flexWrap="wrap">
                  {r.kind === "feed" && <>
                    <RecordPill label="الكمية" value={`${safeNumber(r.knownMl)} ml`} color="#dbeafe" textColor="#1d4ed8" />
                    <RecordPill label="المدة" value={`${safeNumber(r.directMinutes)} دقيقة`} color="#fce7f3" textColor="#be185d" />
                  </>}
                  {r.kind === "diaper" && <RecordPill label="النوع" value={r.type} color="#ccfbf1" textColor="#0f766e" />}
                  {r.kind === "weight" && <>
                    <RecordPill label="الوزن" value={`${safeNumber(r.grams)} g`} color="#ffedd5" textColor="#c2410c" />
                    <RecordPill label="السياق" value={r.context || "غير محدد"} color="#dbeafe" textColor="#1d4ed8" />
                  </>}
                </Stack>
                {r.notes && <Typography variant="body2" sx={{ mt: 1, color: "#475569" }}>{r.notes}</Typography>}
              </Box>
              <Button size="small" variant="outlined" onClick={()=>onEdit({ kind: r.kind, row: r })} sx={{ borderRadius: 3, minWidth: 66, flexShrink: 0 }}>
                تعديل
              </Button>
            </Stack>
          </Paper>
        ))}
      </Stack>
    </>
  );
}

function EditRecordDialog({ editing, onClose, onSave, onDelete }) {
  const [form, setForm] = React.useState(null);
  const [confirmDelete, setConfirmDelete] = React.useState(false);

  React.useEffect(() => {
    setConfirmDelete(false);
    if (!editing) {
      setForm(null);
      return;
    }

    const row = editing.row || {};
    if (editing.kind === "feed") {
      setForm({
        id: row.id,
        date: toDateKey(row.date) || todayStr(),
        time: toTimeKey(row.time) || nowTime(),
        type: row.type || "طبيعي مباشر",
        knownMl: row.knownMl ?? row.ml ?? 0,
        directMinutes: row.directMinutes ?? row.minutes ?? 0,
        side: row.side || "",
        quality: row.quality || "",
        notes: row.notes || "",
        createdAt: row.createdAt || ""
      });
    }

    if (editing.kind === "diaper") {
      setForm({
        id: row.id,
        date: toDateKey(row.date) || todayStr(),
        time: toTimeKey(row.time) || nowTime(),
        type: row.type || "بول",
        stoolColor: row.stoolColor ?? row.color ?? "",
        stoolTexture: row.stoolTexture ?? row.texture ?? "",
        notes: row.notes || "",
        createdAt: row.createdAt || ""
      });
    }

    if (editing.kind === "weight") {
      setForm({
        id: row.id,
        date: toDateKey(row.date) || todayStr(),
        time: toTimeKey(row.time) || nowTime(),
        grams: row.grams || "",
        context: row.context || "",
        notes: row.notes || "",
        createdAt: row.createdAt || ""
      });
    }
  }, [editing]);

  if (!editing || !form) return null;

  const set = (k, v) => setForm({ ...form, [k]: v });

  function save() {
    let row = { ...form };

    if (editing.kind === "feed") {
      row.knownMl = safeNumber(row.knownMl);
      row.directMinutes = safeNumber(row.directMinutes);
    }

    if (editing.kind === "weight") {
      row.grams = safeNumber(row.grams);
    }

    onSave(editing.kind, row);
  }

  return (
    <Dialog open={!!editing} onClose={onClose} fullWidth maxWidth="sm" dir="rtl">
      <DialogTitle fontWeight={900}>تعديل {editing.kind === "feed" ? "رضعة" : editing.kind === "diaper" ? "حفاضة" : "وزن"}</DialogTitle>
      <DialogContent>
        <Grid container spacing={2} sx={{ mt: .5 }}>
          <Grid item xs={6}>
            <TextField fullWidth type="date" label="التاريخ" value={form.date} onChange={e=>set("date", e.target.value)} InputLabelProps={{shrink:true}} />
          </Grid>
          <Grid item xs={6}>
            <TextField fullWidth type="time" label="الوقت" value={form.time} onChange={e=>set("time", e.target.value)} InputLabelProps={{shrink:true}} />
          </Grid>

          {editing.kind === "feed" && (
            <>
              <Grid item xs={12}>
                <TextField select fullWidth label="نوع الرضعة" value={form.type} onChange={e=>set("type", e.target.value)}>
                  {FEED_TYPES.map(x=><MenuItem key={x} value={x}>{x}</MenuItem>)}
                </TextField>
              </Grid>
              <Grid item xs={6}>
                <TextField fullWidth type="number" label="الكمية المعروفة ml" value={form.knownMl} onChange={e=>set("knownMl", e.target.value)} />
              </Grid>
              <Grid item xs={6}>
                <TextField fullWidth type="number" label="مدة الطبيعي بالدقائق" value={form.directMinutes} onChange={e=>set("directMinutes", e.target.value)} />
              </Grid>
              <Grid item xs={6}>
                <TextField select fullWidth label="الجهة" value={form.side} onChange={e=>set("side", e.target.value)}>
                  <MenuItem value="">غير محدد</MenuItem><MenuItem value="يمين">يمين</MenuItem><MenuItem value="شمال">شمال</MenuItem><MenuItem value="يمين وشمال">يمين وشمال</MenuItem>
                </TextField>
              </Grid>
              <Grid item xs={6}>
                <TextField select fullWidth label="الحالة" value={form.quality} onChange={e=>set("quality", e.target.value)}>
                  <MenuItem value="">غير محدد</MenuItem><MenuItem value="كويسة">كويسة</MenuItem><MenuItem value="نامت بسرعة">نامت بسرعة</MenuItem><MenuItem value="رفضت">رفضت</MenuItem><MenuItem value="ترجيع">ترجيع</MenuItem><MenuItem value="شرقان/كحة">شرقان/كحة</MenuItem>
                </TextField>
              </Grid>
            </>
          )}

          {editing.kind === "diaper" && (
            <>
              <Grid item xs={12}>
                <TextField select fullWidth label="نوع الحفاضة" value={form.type} onChange={e=>set("type", e.target.value)}>
                  {DIAPER_TYPES.map(x=><MenuItem key={x} value={x}>{x}</MenuItem>)}
                </TextField>
              </Grid>
              <Grid item xs={6}>
                <TextField fullWidth label="لون البراز" value={form.stoolColor} onChange={e=>set("stoolColor", e.target.value)} />
              </Grid>
              <Grid item xs={6}>
                <TextField select fullWidth label="القوام" value={form.stoolTexture} onChange={e=>set("stoolTexture", e.target.value)}>
                  <MenuItem value="">غير محدد</MenuItem><MenuItem value="لين">لين</MenuItem><MenuItem value="سائل">سائل</MenuItem><MenuItem value="متماسك">متماسك</MenuItem><MenuItem value="مخاطي">مخاطي</MenuItem>
                </TextField>
              </Grid>
            </>
          )}

          {editing.kind === "weight" && (
            <>
              <Grid item xs={6}>
                <TextField fullWidth type="number" label="الوزن g" value={form.grams} onChange={e=>set("grams", e.target.value)} />
              </Grid>
              <Grid item xs={6}>
                <TextField select fullWidth label="التوقيت" value={form.context} onChange={e=>set("context", e.target.value)}>
                  <MenuItem value="">غير محدد</MenuItem><MenuItem value="قبل الرضاعة">قبل الرضاعة</MenuItem><MenuItem value="بعد الرضاعة">بعد الرضاعة</MenuItem><MenuItem value="بعد تغيير الحفاضة">بعد تغيير الحفاضة</MenuItem>
                </TextField>
              </Grid>
            </>
          )}

          <Grid item xs={12}>
            <TextField fullWidth multiline minRows={3} label="ملاحظات" value={form.notes} onChange={e=>set("notes", e.target.value)} />
          </Grid>
        </Grid>
      </DialogContent>
      <DialogActions sx={{ p: 2, gap: 1, flexWrap: "wrap" }}>
        {confirmDelete ? (
          <>
            <Typography sx={{ flex: 1, color: "#ef4444", fontWeight: 700, fontSize: 14, textAlign: "right" }}>
              تأكيد حذف هذا السجل نهائياً؟
            </Typography>
            <Button onClick={() => setConfirmDelete(false)} variant="outlined" size="small">إلغاء</Button>
            <Button onClick={() => { onDelete(editing.kind, editing.row.id); }} variant="contained" color="error" size="small">تأكيد الحذف</Button>
          </>
        ) : (
          <>
            <Button onClick={() => setConfirmDelete(true)} color="error" sx={{ mr: "auto" }} size="small">🗑 حذف</Button>
            <Button onClick={onClose} variant="outlined">إلغاء</Button>
            <Button onClick={save} variant="contained">حفظ التعديل</Button>
          </>
        )}
      </DialogActions>
    </Dialog>
  );
}

function FeedForm({ add, setSyncPaused }) {
  const [form, setForm] = React.useState({ date: todayStr(), time: nowTime(), type: "طبيعي مباشر", knownMl: "", directMinutes: "", side: "", quality: "", notes: "" });
  const [errors, setErrors] = React.useState({});
  React.useEffect(() => { setSyncPaused(true); return () => setSyncPaused(false); }, []);
  function set(k, v) { setForm({ ...form, [k]: v }); setErrors(e => ({ ...e, [k]: "" })); }

  const isBreast = form.type === "طبيعي مباشر";
  const isMixed  = form.type === "مختلط";

  async function submit() {
    const e = {};
    if (!form.date) e.date = "مطلوب";
    if (!form.time) e.time = "مطلوب";
    if (!isBreast && !form.knownMl) e.knownMl = "أدخل الكمية";
    if (isBreast && !form.directMinutes) e.directMinutes = "أدخل المدة";
    if (Object.keys(e).length) { setErrors(e); return; }

    const ok = await add({ ...form, id: uid(), knownMl: safeNumber(form.knownMl), directMinutes: safeNumber(form.directMinutes), createdAt: new Date().toISOString() });
    if (!ok) return;

    setForm({ ...form, time: nowTime(), knownMl: "", directMinutes: "", notes: "" });
    setErrors({});
  }

  return <FormCard title="تسجيل رضعة 🍼" submit={submit}>
    <Grid container spacing={2}>
      <Grid item xs={6}><TextField fullWidth type="date" size="small" label="التاريخ" value={form.date} onChange={e=>set("date",e.target.value)} InputLabelProps={{shrink:true}} error={!!errors.date} helperText={errors.date} /></Grid>
      <Grid item xs={6}><TextField fullWidth type="time" size="small" label="الوقت" value={form.time} onChange={e=>set("time",e.target.value)} InputLabelProps={{shrink:true}} /></Grid>

      <Grid item xs={12}>
        <Typography variant="caption" color="text.secondary" sx={{ mb: 1, display: "block", fontWeight: 700 }}>نوع الرضعة</Typography>
        <Stack direction="row" spacing={1} useFlexGap flexWrap="wrap">
          {FEED_TYPES.map(t => (
            <Chip key={t} label={t} onClick={() => set("type", t)}
              color={form.type === t ? "primary" : "default"}
              variant={form.type === t ? "filled" : "outlined"}
              sx={{ cursor: "pointer", fontWeight: form.type === t ? 800 : 500 }} />
          ))}
        </Stack>
      </Grid>

      {(isBreast || isMixed) && (
        <>
          <Grid item xs={6}><TextField fullWidth type="number" size="small" label="مدة الرضاعة (دقيقة)" value={form.directMinutes} onChange={e=>set("directMinutes",e.target.value)} inputProps={{ min: 0 }} error={!!errors.directMinutes} helperText={errors.directMinutes} /></Grid>
          <Grid item xs={6}>
            <TextField select fullWidth size="small" label="الجهة" value={form.side} onChange={e=>set("side",e.target.value)}>
              <MenuItem value="">غير محدد</MenuItem>
              <MenuItem value="يمين">يمين</MenuItem>
              <MenuItem value="شمال">شمال</MenuItem>
              <MenuItem value="يمين وشمال">يمين وشمال</MenuItem>
            </TextField>
          </Grid>
        </>
      )}

      {(!isBreast || isMixed) && (
        <Grid item xs={12}><TextField fullWidth type="number" size="small" label="الكمية المعروفة (ml)" value={form.knownMl} onChange={e=>set("knownMl",e.target.value)} inputProps={{ min: 0 }} error={!!errors.knownMl} helperText={errors.knownMl} /></Grid>
      )}

      <Grid item xs={12}>
        <TextField select fullWidth size="small" label="حالة الرضعة" value={form.quality} onChange={e=>set("quality",e.target.value)}>
          <MenuItem value="">غير محدد</MenuItem>
          <MenuItem value="كويسة">✅ كويسة</MenuItem>
          <MenuItem value="نامت بسرعة">😴 نامت بسرعة</MenuItem>
          <MenuItem value="رفضت">❌ رفضت</MenuItem>
          <MenuItem value="ترجيع">🤮 ترجيع</MenuItem>
          <MenuItem value="شرقان/كحة">😮 شرقان/كحة</MenuItem>
        </TextField>
      </Grid>

      <Grid item xs={12}><TextField fullWidth multiline minRows={2} size="small" label="ملاحظات (اختياري)" value={form.notes} onChange={e=>set("notes",e.target.value)} /></Grid>
    </Grid>
  </FormCard>;
}

      <Grid item xs={6}><TextField fullWidth type="time" size="small" label="الوقت" value={form.time} onChange={e=>set("time",e.target.value)} InputLabelProps={{shrink:true}} /></Grid>
      <Grid item xs={12} sm={6}><TextField fullWidth type="number" size="small" label="الوزن (جرام)" value={form.grams} onChange={e=>set("grams",e.target.value)} inputProps={{ min: 0 }} error={!!errors.grams} helperText={errors.grams} /></Grid>
      <Grid item xs={12} sm={6}>
        <TextField select fullWidth size="small" label="توقيت القياس" value={form.context} onChange={e=>set("context",e.target.value)}>
          <MenuItem value="">غير محدد</MenuItem>
          <MenuItem value="قبل الرضاعة">قبل الرضاعة</MenuItem>
          <MenuItem value="بعد الرضاعة">بعد الرضاعة</MenuItem>
          <MenuItem value="بعد تغيير الحفاضة">بعد تغيير الحفاضة</MenuItem>
        </TextField>
      </Grid>
      <Grid item xs={12}><TextField fullWidth multiline minRows={2} size="small" label="ملاحظات (اختياري)" value={form.notes} onChange={e=>set("notes",e.target.value)} /></Grid>
    </Grid>
  </FormCard>;
}

function FormCard({ title, children, submit }) {
  const [busy, setBusy] = React.useState(false);

  async function handleSubmit() {
    if (busy) return;
    setBusy(true);
    try {
      await Promise.resolve(submit());
    } finally {
      setTimeout(() => setBusy(false), 1200);
    }
  }

  return (
    <SectionCard title={title}>
      <Stack spacing={2}>
        {children}
        <Button variant="contained" size="large" disabled={busy} onClick={handleSubmit}>
          {busy ? "جاري الحفظ..." : "حفظ"}
        </Button>
      </Stack>
    </SectionCard>
  );
}
